# Setup
general:
  workload: nemotron_3
  workload_type: pretrain
  framework: megatron_bridge

container:
  images: 
    - 'nvcr.io#nvidia/nemo:26.04.00'

downloads:
  huggingface:
    - repo_id: 'nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16'
    - repo_id: 'nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16'

repositories:
  # TODO(runai-PR): revert to upstream NVIDIA-NeMo/Megatron-Bridge @ fab6803 once
  # the RunAICliExecutor lands upstream. Pinned to the koiker fork branch commit
  # so a clean install picks up the Run:ai executor.
  megatron_bridge:
    url: "https://github.com/koiker/Megatron-Bridge.git"
    commit: "3a67caec676e61632a19bbce5b5e9b8fb023f165"

  nemo_run:
    # koiker fork — adds PyTorchJobExecutor (Kubeflow Training Operator v1 PyTorchJob)
    # for NVIDIA Run:ai; branch is based on upstream 64b91e0 (superset: DGXCloudExecutor
    # + KubeflowExecutor + PyTorchJobExecutor). Installed via git+url@<branch>.
    # TODO(runai-PR): revert to upstream NVIDIA-NeMo/Run once v1 PyTorchJob lands.
    url: "https://github.com/koiker/Run.git"
    commit: "runai-pytorchjob-v1-deploy"

setup:
  venv_req: true
  dependencies:
    git:
      megatron_bridge:
        repo_key: megatron_bridge
        install_method:
          type: clone
    pip:
      - package: nemo_run
        repo_key: nemo_run

tools:
  nsys:
    by_gpu:
      gb300: "2025.5.1.121-3638078"
      gb200: "2025.5.1.121-3638078"
      b300: "2025.5.1.121-3638078"
      b200: "2025.5.1.121-3638078"

run:
  launcher_type: 'megatron_bridge'
  launch_script: 'launch.sh'

  gpu_configs:
    gb300:
      model_configs:
        - model_size: '30b'
          dtypes: ['bf16', 'fp8']
          scales: [8, 16, 32, 64]
        - model_size: '120b'
          dtypes: ['bf16', 'fp8', 'nvfp4']
          scales: [64, 128, 256, 512]

    gb200:
      model_configs:
        - model_size: '30b'
          dtypes: ['bf16']
          scales: [8, 16, 32, 64]

    b300:
      model_configs:
        - model_size: '30b'
          dtypes: ['bf16', 'fp8']
          scales: [8, 16, 32, 64]
        - model_size: '120b'
          dtypes: ['bf16']
          scales: [64, 128, 256, 512]

    b200:
      model_configs:
        - model_size: '30b'
          dtypes: ['bf16', 'fp8']
          scales: [8, 16, 32, 64]
        - model_size: '120b'
          dtypes: ['bf16', 'fp8']
          scales: [64, 128, 256, 512]

    h100:
      model_configs:
        - model_size: '30b'
          dtypes: ['bf16', 'fp8']
          scales: [16, 32, 64]
