# Example headless installation config for the Run:ai (NVIDIA Run:ai / DGX Cloud) platform.
#
# Usage:
#   ./install.sh --play example_config_runai.yaml
#
# Prerequisites:
#   - You have run `runai login` on the install/login node (no Application creds needed).
#   - The shared workspace PVC (pvc_claim_name) is mounted at pvc_mount_path on the nodes.
#
# Notes vs. the Slurm example:
#   - platform: runai            -> emits a `platform: runai` cluster_config (no slurm block).
#   - install_method: local      -> install-time tasks (HF asset prefetch, tool downloads)
#                                   run on the login node; Run:ai pulls OCI images directly,
#                                   so there is NO enroot/sqsh build.
#   - A `runai:` block replaces the `slurm:` block.
#
# Image pre-pull (optional): to warm every node's containerd cache before the first
# benchmark (avoids ImagePullBackOff on the large NeMo image), set before --play:
#   export LLMB_RUNAI_PREPULL_NODES=<number_of_nodes>   # enables auto-submit of a puller job
#   export LLMB_RUNAI_PREPULL=0                          # to print the command instead of submitting

venv_type: venv
install_path: /cm/shared/nemo-workspace/llmb-runai/install
gpu_type: b300
node_architecture: x86_64

platform: runai
install_method: local

runai:
  project_name: nccl-benchmarking
  pvc_claim_name: nemo-workspace
  pvc_mount_path: /cm/shared/nemo-workspace
  container_image: nvcr.io/nvidia/nemo:26.04.00
  # RoCE/GDR rails as Kubernetes extended resources (one per rail).
  extended_resources:
    - nvidia.com/r0-p0=1
    - nvidia.com/r1-p0=1
    - nvidia.com/r2-p0=1
    - nvidia.com/r3-p0=1
    - nvidia.com/r4-p0=1
    - nvidia.com/r5-p0=1
    - nvidia.com/r6-p0=1
    - nvidia.com/r7-p0=1
  # Multus network annotation (single comma-joined networks string).
  annotations:
    - k8s.v1.cni.cncf.io/networks=default/r0-p0,default/r1-p0,default/r2-p0,default/r3-p0,default/r4-p0,default/r5-p0,default/r6-p0,default/r7-p0
  large_shm: true
  rails_on_master: true

selected_workloads:
  - pretrain_nemotron_3

environment_vars:
  # HF_TOKEN only needed for gated repos / to avoid rate limits; Nemotron-3 is ungated.
  HF_TOKEN: ""
