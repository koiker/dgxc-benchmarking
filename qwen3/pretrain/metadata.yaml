# Setup
general:
  workload: qwen3
  workload_type: pretrain
  framework: megatron_bridge

container:
  images:
    - 'nvcr.io#nvidia/nemo:26.04.00'

downloads:
  huggingface:
    - repo_id: 'Qwen/Qwen3-30B-A3B'
    - repo_id: 'Qwen/Qwen3-235B-A22B'

repositories:
  # TODO(runai-PR): revert to upstream NVIDIA-NeMo/Megatron-Bridge once the
  # RunAICliExecutor lands upstream. The koiker fork branch carries the Run:ai
  # executor and includes the qwen3 configs, so a clean install picks it up.
  megatron_bridge:
    url: "https://github.com/koiker/Megatron-Bridge.git"
    commit: "3a67caec676e61632a19bbce5b5e9b8fb023f165"
  nemo_run:
    url: "https://github.com/NVIDIA-NeMo/Run.git"
    commit: "64b91e0187b93475ea0d54028317e349ced7ac1b"

setup:
  venv_req: true
  dependencies:
    git:
      megatron_bridge:
        repo_key: megatron_bridge
        install_method:
          type: clone
    pip:
      - package: nemo_run
        repo_key: nemo_run

tools:
  nsys:
    by_gpu:
      gb300: "2025.5.1.121-3638078"
      gb200: "2025.5.1.121-3638078"
      b200: "2025.5.1.121-3638078"


# Run
run:
  launcher_type: 'megatron_bridge'
  launch_script: 'launch.sh'

  gpu_configs:
    gb300:
      model_configs:
        - model_size: '235b'
          dtypes: ['bf16']
          scales: [256,512]
        - model_size: '30b'
          dtypes: ['bf16']
          scales: [8,16,32,64]

    gb200:
      model_configs:
        - model_size: '235b'
          dtypes: ['bf16']
          scales: [256,512]
        - model_size: '30b'
          dtypes: ['bf16']
          scales: [8,16,32,64]

    b300:
      model_configs:
        - model_size: '235b'
          dtypes: ['bf16']
          scales: [256,512]
        - model_size: '30b'
          dtypes: ['bf16']
          scales: [8,16,32,64]

    b200:
      model_configs:
        - model_size: '235b'
          dtypes: ['bf16']
          scales: [256,512]
        - model_size: '30b'
          dtypes: ['bf16']
          scales: [8,16,32,64]

    h100:
      model_configs:
        - model_size: '235b'
          dtypes: ['bf16']
          scales: [256,512]
        - model_size: '30b'
          dtypes: ['bf16']
          scales: [16,32,64]
