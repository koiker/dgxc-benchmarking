# Setup
general:
  workload: llama3.1
  workload_type: pretrain
  framework: megatron_bridge

container:
  images: 
    - 'nvcr.io#nvidia/nemo:26.04.00'

repositories: 
  # TODO(runai-PR): revert to upstream NVIDIA-NeMo/Megatron-Bridge once the
  # RunAICliExecutor lands upstream. The koiker fork branch carries the Run:ai
  # executor and includes the llama3.1 configs, so a clean install picks it up.
  megatron_bridge:
    url: "https://github.com/koiker/Megatron-Bridge.git"
    commit: "3a67caec676e61632a19bbce5b5e9b8fb023f165"
  nemo_run:
    # koiker fork — adds PyTorchJobExecutor (Kubeflow Training Operator v1 PyTorchJob)
    # for NVIDIA Run:ai; branch is based on upstream 64b91e0 (superset: DGXCloudExecutor
    # + KubeflowExecutor + PyTorchJobExecutor). Installed via git+url@<branch>.
    # TODO(runai-PR): revert to upstream NVIDIA-NeMo/Run once v1 PyTorchJob lands.
    url: "https://github.com/koiker/Run.git"
    commit: "runai-pytorchjob-v1-deploy"

downloads:
  huggingface:
    - repo_id: 'meta-llama/Meta-Llama-3-8B'
      assets: [config]
    - repo_id: 'meta-llama/Meta-Llama-3-70B'
      assets: [config]
    - repo_id: 'meta-llama/Meta-Llama-3.1-405B'
      assets: [config]

setup:
  venv_req: true
  dependencies:
    git:
      megatron_bridge:
        repo_key: megatron_bridge
        install_method:
          type: clone
    pip:
      - package: nemo_run
        repo_key: nemo_run

tools:
  cuda_cupti_lib: "13.0.85"

# Run
run:
  launcher_type: 'megatron_bridge'
  launch_script: 'launch.sh'

  gpu_configs:
    gb300:
      model_configs:
        - model_size: '405b'
          dtypes: ['fp8', 'nvfp4']
          scales: [256, 512]
        - model_size: '70b'
          dtypes: ['fp8', 'nvfp4']
          scales: [64,128,256,512]
        - model_size: '8b'
          dtypes: ['fp8', 'nvfp4']
          scales: [8,16,32,64,128]
    gb200:
      model_configs:
        - model_size: '405b'
          dtypes: ['fp8', 'nvfp4']
          scales: [256, 512]
        - model_size: '70b'
          dtypes: ['fp8', 'nvfp4']
          scales: [64,128,256,512]
        - model_size: '8b'
          dtypes: ['fp8', 'nvfp4']
          scales: [8,16,32,64,128]
    b300:
      model_configs:
        - model_size: '405b'
          dtypes: ['fp8', 'nvfp4']
          scales: [256, 512]
        - model_size: '70b'
          dtypes: ['fp8', 'nvfp4']
          scales: [64,128,256,512]
        - model_size: '8b'
          dtypes: ['fp8', 'nvfp4']
          scales: [8,16,32,64,128]
    b200:
      model_configs:
        - model_size: '405b'
          dtypes: ['fp8', 'nvfp4']
          scales: [256, 512]
        - model_size: '70b'
          dtypes: ['fp8', 'nvfp4']
          scales: [64,128,256,512]
        - model_size: '8b'
          dtypes: ['fp8', 'nvfp4']
          scales: [8,16,32,64,128]
    h100:
      model_configs:
        - model_size: '405b'
          dtypes:  ['bf16', 'fp8']
          scales:  [1024]
        - model_size: '70b'
          dtypes:  ['bf16', 'fp8']
          scales:  [64,128,256,512]
        - model_size: '8b'
          dtypes:  ['bf16', 'fp8']
          scales:  [8,16,32,64,128]
