# Setup
general:
  workload: nemotron-h
  workload_type: pretrain
  framework: megatron_bridge

container:
  images: 
    - 'nvcr.io#nvidia/nemo:26.02.01'

repositories:
  # TODO(runai-PR): revert to upstream NVIDIA-NeMo/Megatron-Bridge @ f07871e once
  # the RunAICliExecutor lands upstream. The koiker fork branch is f07871e + the
  # Run:ai executor, so a clean install picks it up.
  megatron_bridge:
    url: "https://github.com/koiker/Megatron-Bridge.git"
    commit: "3a67caec676e61632a19bbce5b5e9b8fb023f165"

  nemo_run:
    # koiker fork — adds PyTorchJobExecutor (Kubeflow Training Operator v1 PyTorchJob)
    # for NVIDIA Run:ai. Branch is based on upstream 64b91e0, which supersets the prior
    # pin ab0c432 (clean forward-upgrade: ab0c432 is an ancestor of 64b91e0; adds
    # KubeflowExecutor + PyTorchJobExecutor). Installed via git+url@<branch>.
    # TODO(runai-PR): revert to upstream NVIDIA-NeMo/Run once v1 PyTorchJob lands.
    url: "https://github.com/koiker/Run.git"
    commit: "runai-pytorchjob-v1-deploy"

setup:
  venv_req: true
  dependencies:
    git:
      megatron_bridge:
        repo_key: megatron_bridge
        install_method:
          type: clone
    pip:
      - package: nemo_run
        repo_key: nemo_run

# Run
run:
  launcher_type: 'megatron_bridge'
  launch_script: 'launch.sh'

  gpu_configs:
    gb300:
      model_configs:
        - model_size: '56b'
          dtypes: 'fp8'
          scales: [32, 64, 128, 256, 512]

    gb200:
      model_configs:
        - model_size: '56b'
          dtypes: 'fp8'
          scales: [32, 64, 128, 256, 512]

    b300:
      model_configs:
        - model_size: '56b'
          dtypes: 'fp8'
          scales: [32, 64, 128, 256, 512]

    b200:
      model_configs:
        - model_size: '56b'
          dtypes: 'fp8'
          scales: [32, 64, 128, 256, 512]

    h100:
      model_configs:
        - model_size: '56b'
          dtypes: 'fp8'
          scales: [32, 64, 128, 256, 512]
